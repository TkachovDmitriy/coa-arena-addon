name: Release

on:
   push:
      tags:
         - "v*"

permissions:
   contents: write

jobs:
   release:
      runs-on: ubuntu-latest
      steps:
         - name: Check out repository
           uses: actions/checkout@v4

         - name: Install Lua tooling
           run: |
              sudo apt-get update
              sudo apt-get install --yes lua5.1 luarocks ripgrep zip
              sudo luarocks install luacheck

         - name: Verify tag and addon version
           run: |
              addon_version="$(sed -n 's/^## Version: *//p' TDArenaLens/TDArenaLens.toc)"
              test "v$addon_version" = "${GITHUB_REF_NAME}"

         - name: Run quality checks
           run: ./scripts/check.sh

         - name: Package addon
           run: ./scripts/package-release.sh

         - name: Publish GitHub pre-release
           env:
              GH_TOKEN: ${{ github.token }}
           run: >-
              gh release create "${GITHUB_REF_NAME}"
              dist/TDArenaLens-*.zip
              --prerelease
              --title "TD ArenaLens ${GITHUB_REF_NAME}"
              --notes-file docs/release-notes-0.1.0-alpha.1.md
