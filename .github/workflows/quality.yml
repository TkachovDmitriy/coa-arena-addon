name: Quality

on:
   push:
   pull_request:

jobs:
   lua:
      runs-on: ubuntu-latest
      steps:
         - name: Check out repository
           uses: actions/checkout@v4

         - name: Install Lua tooling
           run: |
              sudo apt-get update
              sudo apt-get install --yes lua5.1 luarocks ripgrep
              sudo luarocks install luacheck

         - name: Check Lua and repository whitespace
           run: ./scripts/check.sh
